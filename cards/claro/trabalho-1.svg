<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="161" viewBox="0 0 1000 161">
<style>
  text { font-family: -apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','Segoe UI',Inter,Arial,sans-serif; }
  .in { opacity: 0; animation: in 1.1s cubic-bezier(.2,.7,.2,1) forwards; }
  @keyframes in { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; transform: none !important; } }
.go { animation: go 3.2s cubic-bezier(.4,0,.2,1) infinite; } @keyframes go { 0%,70%,100% { transform: translateX(0); } 80% { transform: translateX(6px); } 90% { transform: translateX(0); } }</style>
<line x1="0" y1=".5" x2="1000" y2=".5" stroke="#d2d2d7"/>
<g class="in" style="animation-delay:0.00s">
<text x="0" y="58" font-size="16" font-weight="600" fill="#86868b">01</text>
<text x="64" y="58" font-size="13" font-weight="600" letter-spacing="1.5" fill="#0071e3">RELATÓRIO  ·  POWER BI</text>
<text x="64" y="94" font-size="27" font-weight="700" letter-spacing="-.7" fill="#1d1d1f">Dashboard de RH</text>
<text x="64" y="124" font-size="17" fill="#6e6e73"><tspan x="64" dy="0">Gestão de pessoas: turnover, absenteísmo e clima organizacional para decisões de RH.</tspan></text>
<g class="go" style="animation-delay:1.0s">
<circle cx="968" cy="80" r="26" fill="none" stroke="#0071e3" stroke-width="1.8"/>
<path d="M959 80 H978 M970 72 L979 80 L970 90" fill="none" stroke="#0071e3" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g>
</g>
</svg>
