name: Atualizar arte do perfil

on:
  schedule:
    - cron: "17 9 * * *"   # todo dia, 06:17 em Brasília
  workflow_dispatch:        # botão "Run workflow" na aba Actions
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "assets/**"
      - ".github/workflows/update-profile-art.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r scripts/requirements.txt

      - name: Baixar contribuições
        env:
          # opcional: crie o secret GH_PAT (token com escopo read:user) para contar contribuições privadas
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python scripts/fetch_contributions.py

      - name: Gerar gráfico e estatísticas
        run: |
          python scripts/render_heatmap_svg.py
          python scripts/render_stats_svg.py

      # o retrato só é refeito quando a foto/scripts mudam ou quando você roda manualmente
      - name: Gerar retrato ASCII
        if: github.event_name != 'schedule' || hashFiles('avatar-ascii.svg') == ''
        env:
          GH_LOGIN: ${{ github.repository_owner }}
        run: |
          pip install "rembg[cpu]"
          python scripts/make_ascii_svg.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contrib-heatmap.svg stats.svg avatar-ascii.svg data/contributions.json
          git diff --cached --quiet || git commit -m "chore: atualizar arte do perfil [skip ci]"
          git push
