<svg xmlns="http://www.w3.org/2000/svg" width="333.33" height="240" viewBox="0 0 333.33 240">
<style>
  text { font-family: -apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','Segoe UI',Inter,Arial,sans-serif; }
  .in { opacity: 0; animation: in 1.1s cubic-bezier(.2,.7,.2,1) forwards; }
  @keyframes in { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; transform: none !important; } }
.rule { stroke-dasharray: 48; stroke-dashoffset: 48; animation: rule 1s cubic-bezier(.4,0,.2,1) .4s forwards; } @keyframes rule { to { stroke-dashoffset: 0; } }</style>
<g class="in" style="animation-delay:0.00s">
<rect x="0" y="10" width="325.3" height="220" rx="28" fill="#f5f5f7"/>
<text x="32" y="70" font-size="15" font-weight="600" letter-spacing="1.5" fill="#0071e3">01</text>
<line class="rule" style="animation-delay:0.40s" x1="32" y1="90" x2="80" y2="90" stroke="#0071e3" stroke-width="3" stroke-linecap="round"/>
<text x="32" y="142" font-size="26" font-weight="700" letter-spacing="-.7" fill="#1d1d1f">Engenharia de dados</text>
<text x="32" y="178" font-size="16" fill="#86868b"><tspan x="32" dy="0">BigQuery · Databricks · Airflow</tspan><tspan x="32" dy="24">SAP HANA</tspan></text></g>
</svg>
