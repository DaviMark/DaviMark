name: Atualizar perfil

on:
  workflow_dispatch:        # botão "Run workflow" na aba Actions
  push:
    branches: [main]
    paths:
      - "config/**"
      - "scripts/**"
      - ".github/workflows/update-profile-art.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar cards e README
        run: python scripts/build_profile.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A cards README.md
          git diff --cached --quiet || git commit -m "chore: atualizar perfil [skip ci]"
          git push
