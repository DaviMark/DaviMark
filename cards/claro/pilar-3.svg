<svg xmlns="http://www.w3.org/2000/svg" width="333.33" height="380" viewBox="0 0 333.33 380">
<style>
  text { font-family: -apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','Segoe UI',Inter,Arial,sans-serif; }
  .in { opacity: 0; animation: in 1.1s cubic-bezier(.2,.7,.2,1) forwards; }
  @keyframes in { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; transform: none !important; } }
.rule { stroke-dasharray: 48; stroke-dashoffset: 48; animation: rule 1s cubic-bezier(.4,0,.2,1) forwards; } @keyframes rule { to { stroke-dashoffset: 0; } }</style>
<g class="in" style="animation-delay:0.30s">
<rect x="8" y="10" width="325.3" height="360" rx="28" fill="#f5f5f7"/>
<text x="40" y="72" font-size="15" font-weight="600" letter-spacing="1.5" fill="#0071e3">03</text>
<line class="rule" style="animation-delay:0.70s" x1="40" y1="92" x2="88" y2="92" stroke="#0071e3" stroke-width="3" stroke-linecap="round"/>
<text x="40" y="146" font-size="27" font-weight="700" letter-spacing="-.7" fill="#1d1d1f">Produtos de dados</text>
<text x="40" y="186" font-size="16.5" fill="#6e6e73"><tspan x="40" dy="0">Traduzo necessidades do</tspan><tspan x="40" dy="26">negócio em relatórios claros,</tspan><tspan x="40" dy="26">com foco em experiência do</tspan><tspan x="40" dy="26">usuário e narrativa, para que</tspan><tspan x="40" dy="26">a diretoria decida com</tspan><tspan x="40" dy="26">segurança.</tspan></text></g>
</svg>
