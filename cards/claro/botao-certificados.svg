<svg xmlns="http://www.w3.org/2000/svg" width="250" height="84" viewBox="0 0 250 84">
<style>
  text { font-family: -apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','Segoe UI',Inter,Arial,sans-serif; }
  .in { opacity: 0; animation: in 1s cubic-bezier(.2,.7,.2,1) forwards; }
