<text class="in" x="0" y="64" font-size="15" font-weight="600" letter-spacing="2.2" fill="#2997ff">ANALYTICS ENGINEER · UOL</text>
<text class="in" style="animation-delay:.1s" x="0" y="148" font-size="68" font-weight="700" letter-spacing="-2.4" fill="#f5f5f7">Dados que viram</text>
