<style>
  text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .in { opacity: 0; animation: fadeUp .7s ease-out forwards; }
  .fade { opacity: 0; animation: fadeIn .5s ease-out forwards; }
  .tw { animation: tw 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } @keyframes tw { 0%,100% { opacity: .25; transform: scale(.7); } 50% { opacity: 1; transform: scale(1); } } .float { animation: fl 6s ease-in-out infinite; } @keyframes fl { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } } .bar { transform-box: fill-box; transform-origin: 50% 100%; transform: scaleY(0); animation: grow .8s cubic-bezier(.2,.8,.2,1) forwards; } @keyframes grow { to { transform: scaleY(1); } }
</style>

