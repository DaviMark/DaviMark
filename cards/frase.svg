<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="76" viewBox="0 0 1000 76">
<style>
  text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .in { opacity: 0; animation: fadeUp .7s ease-out forwards; }
  .fade { opacity: 0; animation: fadeIn .5s ease-out forwards; }
  
</style>
<rect x="6" y="6" width="988" height="64" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>
<text x="500" y="44" text-anchor="middle" font-size="15" font-style="italic" fill="#8b949e"><tspan fill="#3fb950" font-weight="800">“</tspan> Dados bem modelados contam histórias. Eu construo a estrutura para que sejam ouvidas. <tspan fill="#3fb950" font-weight="800">”</tspan></text>
</svg>
