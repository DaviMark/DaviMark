<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="142" viewBox="0 0 1000 142">
<style>
  text { font-family: -apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','Segoe UI',Inter,Arial,sans-serif; }
  .in { opacity: 0; animation: in 1.1s cubic-bezier(.2,.7,.2,1) forwards; }
  @keyframes in { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; transform: none !important; } }
</style>

<text class="in" x="0" y="74" font-size="52" font-weight="700" letter-spacing="-1.8" fill="#1d1d1f">Contato.</text>
<text class="in" style="animation-delay:.12s" x="0" y="124" font-size="21" fill="#6e6e73"><tspan x="0" dy="0">Estou disponível para conversar sobre projetos de dados, BI e engenharia de dados.</tspan></text>
</svg>
