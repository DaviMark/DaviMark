<style>
  .mono { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; }
  .sans { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .fade { opacity: 0; animation: fadeIn .5s ease-out forwards; }
  .rise { opacity: 0; animation: fadeUp .6s ease-out forwards; }
  .bar { transform-box: fill-box; transform-origin: 50% 100%; transform: scaleY(0); animation: grow .7s cubic-bezier(.2,.8,.2,1) forwards; } @keyframes grow { to { transform: scaleY(1); } }
</style>
