<style>
  text { font-family: -apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','Segoe UI',Inter,Arial,sans-serif; }
  .in { opacity: 0; animation: in 1s cubic-bezier(.2,.7,.2,1) forwards; }
  @keyframes in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; transform: none !important; } }
.words { animation: words 10.4s cubic-bezier(.7,0,.3,1) infinite; } @keyframes words { 0.00% { transform: translateY(-0px); } 20.00% { transform: translateY(-0px); } 25.00% { transform: translateY(-84px); } 45.00% { transform: translateY(-84px); } 50.00% { transform: translateY(-168px); } 70.00% { transform: translateY(-168px); } 75.00% { transform: translateY(-252px); } 95.00% { transform: translateY(-252px); } 100% { transform: translateY(-336px); } } .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 2.4s cubic-bezier(.4,0,.2,1) .7s forwards; } @keyframes draw { to { stroke-dashoffset: 0; } } .area, .endp { opacity: 0; animation: show .8s ease-out 2.6s forwards; } @keyframes show { to { opacity: 1; } } .roll { animation: roll 2.2s cubic-bezier(.16,.84,.24,1) both; } @keyframes roll { from { transform: translateY(0); } to { transform: translateY(var(--to)); } }</style>

