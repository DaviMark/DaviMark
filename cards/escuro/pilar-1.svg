<svg xmlns="http://www.w3.org/2000/svg" width="333.33" height="380" viewBox="0 0 333.33 380">
<style>
  text { font-family: -apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','Segoe UI',Inter,Arial,sans-serif; }
  .in { opacity: 0; animation: in 1.1s cubic-bezier(.2,.7,.2,1) forwards; }
  @keyframes in { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; transform: none !important; } }
.rule { stroke-dasharray: 48; stroke-dashoffset: 48; animation: rule 1s cubic-bezier(.4,0,.2,1) forwards; } @keyframes rule { to { stroke-dashoffset: 0; } }</style>
<g class="in" style="animation-delay:0.00s">
<rect x="0" y="10" width="325.3" height="360" rx="28" fill="#161617"/>
<text x="32" y="72" font-size="15" font-weight="600" letter-spacing="1.5" fill="#2997ff">01</text>
<line class="rule" style="animation-delay:0.40s" x1="32" y1="92" x2="80" y2="92" stroke="#2997ff" stroke-width="3" stroke-linecap="round"/>
<text x="32" y="146" font-size="27" font-weight="700" letter-spacing="-.7" fill="#f5f5f7">Engenharia de dados</text>
<text x="32" y="186" font-size="16.5" fill="#a1a1a6"><tspan x="32" dy="0">Desenho pipelines ETL/ELT no</tspan><tspan x="32" dy="26">BigQuery e no Databricks,</tspan><tspan x="32" dy="26">integrando SAP HANA, Oracle,</tspan><tspan x="32" dy="26">SQL Server e APIs, com</tspan><tspan x="32" dy="26">orquestração no Airflow e</tspan><tspan x="32" dy="26">CI/CD.</tspan></text></g>
</svg>
