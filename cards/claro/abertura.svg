<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="690" viewBox="0 0 1000 690">
<style>
  text { font-family: -apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','Segoe UI',Inter,Arial,sans-serif; }
  .in { opacity: 0; animation: in 1.1s cubic-bezier(.2,.7,.2,1) forwards; }
  @keyframes in { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; transform: none !important; } }
.words { animation: words 11.2s cubic-bezier(.7,0,.3,1) 1.2s infinite; } @keyframes words { 0.00% { transform: translateY(-0px); } 20.00% { transform: translateY(-0px); } 25.00% { transform: translateY(-84px); } 45.00% { transform: translateY(-84px); } 50.00% { transform: translateY(-168px); } 70.00% { transform: translateY(-168px); } 75.00% { transform: translateY(-252px); } 95.00% { transform: translateY(-252px); } 100% { transform: translateY(-336px); } }</style>

<defs><clipPath id="slot"><rect x="0" y="232" width="1000" height="84"/></clipPath></defs>
<text class="in" x="0" y="58" font-size="15" font-weight="600" letter-spacing="2.4" fill="#0071e3">ANALYTICS ENGINEER · UOL</text>
<text class="in" style="animation-delay:.1s" x="0" y="144" font-size="72" font-weight="700" letter-spacing="-2.6" fill="#1d1d1f">Olá, eu sou o David.</text>
<text class="in" style="animation-delay:.22s" x="0" y="224" font-size="72" font-weight="700" letter-spacing="-2.6" fill="#86868b">Transformo dados em</text>
<g class="in" style="animation-delay:.34s"><g clip-path="url(#slot)"><g class="words"><text x="0" y="304" font-size="72" font-weight="700" letter-spacing="-2.6" fill="#0071e3">decisões.</text><text x="0" y="388" font-size="72" font-weight="700" letter-spacing="-2.6" fill="#0071e3">estratégia.</text><text x="0" y="472" font-size="72" font-weight="700" letter-spacing="-2.6" fill="#0071e3">clareza.</text><text x="0" y="556" font-size="72" font-weight="700" letter-spacing="-2.6" fill="#0071e3">resultado.</text><text x="0" y="640" font-size="72" font-weight="700" letter-spacing="-2.6" fill="#0071e3">decisões.</text></g></g></g>
<text class="in" style="animation-delay:0.50s" x="0" y="400" font-size="21" fill="#6e6e73"><tspan x="0" dy="0">Sou Analytics Engineer com 7 anos de experiência em dados. Atualmente conduzo, na UOL, a</tspan><tspan x="0" dy="33">transição dos dados do SAP S/4HANA para o Google Cloud, com pipelines governados,</tspan><tspan x="0" dy="33">versionados e totalmente automatizados.</tspan></text><text class="in" style="animation-delay:0.65s" x="0" y="525" font-size="21" fill="#6e6e73"><tspan x="0" dy="0">Minha formação é em Engenharia Mecânica, e foi na indústria que aprendi a enxergar</tspan><tspan x="0" dy="33">processos. Hoje uno a robustez da engenharia à inteligência de negócio para entregar dados</tspan><tspan x="0" dy="33">confiáveis a quem precisa decidir.</tspan></text>
<g class="in" style="animation-delay:.8s">
<circle cx="6" cy="644" r="5" fill="none" stroke="#86868b" stroke-width="1.6"/>
<text x="20" y="650" font-size="16" fill="#86868b">Jacareí, SP</text></g>
</svg>
