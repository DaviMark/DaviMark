<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300">
<style>
  text { font-family: -apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','Segoe UI',Inter,Arial,sans-serif; }
  .in { opacity: 0; animation: in 1.1s cubic-bezier(.2,.7,.2,1) forwards; }
  @keyframes in { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; transform: none !important; } }
.wipe { transform: translateX(-100%); animation: wipe 1.1s cubic-bezier(.7,0,.2,1) .1s forwards; } @keyframes wipe { to { transform: none; } } .rule { stroke-dasharray: 80; stroke-dashoffset: 80; animation: rule 1s cubic-bezier(.4,0,.2,1) .9s forwards; } @keyframes rule { to { stroke-dashoffset: 0; } }</style>

<defs><clipPath id="wipe"><rect class="wipe" x="0" y="40" width="1000" height="110"/></clipPath></defs>
<g clip-path="url(#wipe)"><text x="0" y="130" font-size="88" font-weight="700" letter-spacing="-3.4" fill="#f5f5f7">David Marques</text></g>
<line class="rule" x1="2" y1="170" x2="82" y2="170" stroke="#2997ff" stroke-width="4" stroke-linecap="round"/>
<text class="in" style="animation-delay:.5s" x="0" y="226" font-size="30" font-weight="600" letter-spacing="-.6" fill="#a1a1a6">Analytics Engineer · UOL</text>
<text class="in" style="animation-delay:.7s" x="0" y="272" font-size="18" fill="#86868b" xml:space="preserve">Engenharia de dados e Power BI   ·   7 anos de experiência   ·   Jacareí, SP</text>
</svg>
