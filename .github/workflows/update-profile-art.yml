name: Atualizar perfil

on:
  schedule:
    - cron: "17 9 * * *"   # todo dia, 06:17 em Brasília
  workflow_dispatch:        # botão "Run workflow" na aba Actions
  push:
    branches: [main]
    paths:
      - "config/**"
      - "scripts/**"
      - ".github/workflows/update-profile-art.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r scripts/requirements.txt

      - name: Baixar contribuições e números do GitHub
        env:
          # opcional: crie o secret GH_PAT (token com escopo read:user) para contar contribuições privadas
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python scripts/fetch_contributions.py

      - name: Gerar cards e README
        run: python scripts/build_profile.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A cards README.md data
          git diff --cached --quiet || git commit -m "chore: atualizar perfil [skip ci]"
          git push
