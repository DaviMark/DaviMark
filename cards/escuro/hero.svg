<text class="in" style="animation-delay:.35s" x="0" y="334" font-size="18" fill="#a1a1a6"><tspan x="0" dy="0">Transformo dados complexos em decisões. Pipelines,</tspan><tspan x="0" dy="27">modelagem semântica e dashboards em Power BI para</tspan><tspan x="0" dy="27">grandes operações.</tspan></text>
<text class="in" style="animation-delay:.45s" x="0" y="441" font-size="15" fill="#86868b">Jacareí, SP  ·  7 anos em dados e BI</text>

