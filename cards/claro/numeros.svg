<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="140" viewBox="0 0 1000 140">
<style>
  text { font-family: -apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','Segoe UI',Inter,Arial,sans-serif; }
  .in { opacity: 0; animation: in .9s cubic-bezier(.2,.7,.2,1) forwards; }
  @keyframes in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  
</style>
<line x1="0" y1="20.5" x2="1000" y2="20.5" stroke="#d2d2d7"/><g class="in" style="animation-delay:0.10s"><text x="0.0" y="74" font-size="44" font-weight="600" letter-spacing="-1" fill="#1d1d1f">7 anos</text><text x="0.0" y="104" font-size="15" fill="#6e6e73">de experiência</text></g><g class="in" style="animation-delay:0.18s"><text x="250.0" y="74" font-size="44" font-weight="600" letter-spacing="-1" fill="#1d1d1f">495</text><text x="250.0" y="104" font-size="15" fill="#6e6e73">contribuições no ano</text></g><g class="in" style="animation-delay:0.26s"><text x="500.0" y="74" font-size="44" font-weight="600" letter-spacing="-1" fill="#1d1d1f">6</text><text x="500.0" y="104" font-size="15" fill="#6e6e73">relatórios e projetos</text></g><g class="in" style="animation-delay:0.34s"><text x="750.0" y="74" font-size="44" font-weight="600" letter-spacing="-1" fill="#1d1d1f">8</text><text x="750.0" y="104" font-size="15" fill="#6e6e73">repositórios públicos</text></g><line x1="0" y1="139.5" x2="1000" y2="139.5" stroke="#d2d2d7"/>
</svg>
